
[package]
name = "rust-zkp-grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
num-bigint = { version = "0.4.6", features = ["rand"] }
prost = "0.14.1"
rand = "0.8"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.1"
tonic-prost = "0.14.1"

[build-dependencies]
tonic-build = "0.14.1"
tonic-prost-build = "0.14.1"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"
